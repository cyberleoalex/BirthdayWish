<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080014">

<title>Happy Birthday </title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:'Poppins',sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 50% 40%,#35105f 0%,#120522 38%,#050009 78%);
}

/* =========================
   BACKGROUND
========================= */

.bg-glow{
    position:fixed;
    width:450px;
    height:450px;
    border-radius:50%;
    background:#c026ff;
    filter:blur(150px);
    opacity:.22;
    left:50%;
    top:45%;
    transform:translate(-50%,-50%);
    animation:pulseGlow 4s infinite alternate;
}

@keyframes pulseGlow{
    from{
        transform:translate(-50%,-50%) scale(.8);
    }
    to{
        transform:translate(-50%,-50%) scale(1.2);
    }
}

.stars{
    position:fixed;
    inset:0;
    pointer-events:none;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:#fff;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{
        opacity:.15;
        transform:scale(.5);
    }
    to{
        opacity:1;
        transform:scale(1.5);
    }
}

/* =========================
   BALLOONS
========================= */

.balloon{
    position:fixed;
    width:48px;
    height:62px;
    border-radius:50% 50% 45% 45%;
    opacity:.9;
    z-index:2;
    animation:floatBalloon 5s ease-in-out infinite;
}

.balloon::after{
    content:"";
    position:absolute;
    width:1px;
    height:100px;
    top:60px;
    left:50%;
    background:rgba(255,255,255,.35);
}

.b1{
    background:#ff4fa3;
    left:7%;
    top:8%;
}

.b2{
    background:#8d5cff;
    right:8%;
    top:12%;
    animation-delay:1s;
}

.b3{
    background:#00d9ff;
    left:10%;
    bottom:12%;
    animation-delay:2s;
}

.b4{
    background:#ffd43b;
    right:10%;
    bottom:9%;
    animation-delay:3s;
}

@keyframes floatBalloon{
    0%,100%{
        transform:translateY(0) rotate(-4deg);
    }
    50%{
        transform:translateY(-25px) rotate(5deg);
    }
}

/* =========================
   MAIN CARD
========================= */

.container{
    position:relative;
    z-index:5;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.card{
    position:relative;
    width:min(94vw,520px);
    min-height:680px;
    max-height:96vh;
    padding:30px 24px 30px;
    text-align:center;

    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.15);
    border-radius:35px;

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    box-shadow:
        0 25px 80px rgba(0,0,0,.55),
        inset 0 0 30px rgba(255,255,255,.03);

    overflow:hidden;

    animation:cardIn 1.2s ease;
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(50px) scale(.9);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.card::before{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:35px;
    padding:2px;

    background:
        linear-gradient(
            120deg,
            transparent,
            rgba(255,105,180,.7),
            transparent,
            rgba(160,80,255,.7),
            transparent
        );

    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

    -webkit-mask-composite:xor;
    mask-composite:exclude;

    pointer-events:none;
}

/* =========================
   HEADER
========================= */

.small-title{
    font-size:11px;
    letter-spacing:4px;
    text-transform:uppercase;
    color:#ff9fdb;
    margin-bottom:8px;
}

h1{
    font-family:'Pacifico',cursive;
    font-size:clamp(38px,10vw,62px);
    line-height:1.15;

    background:
        linear-gradient(
            90deg,
            #fff,
            #ff8fd4,
            #c99aff,
            #fff
        );

    background-size:300%;

    -webkit-background-clip:text;
    color:transparent;

    animation:textShine 4s linear infinite;
}

@keyframes textShine{
    to{
        background-position:300%;
    }
}

/* =========================
   PREMIUM PHOTO
========================= */

.profile-photo{
    position:relative;
    width:145px;
    height:145px;
    margin:10px auto 5px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
    z-index:3;
}

.profile-photo img{
    position:relative;

    width:120px;
    height:120px;

    object-fit:cover;
    border-radius:50%;

    border:4px solid rgba(255,255,255,.9);

    box-shadow:
        0 0 15px rgba(255,105,180,.7),
        0 0 40px rgba(170,70,255,.45);

    z-index:2;

    transition:.5s ease;
}

.profile-photo:hover img{
    transform:scale(1.08);
}

.photo-ring{
    position:absolute;

    width:138px;
    height:138px;

    border-radius:50%;

    border:2px solid rgba(255,120,210,.7);

    border-top-color:#fff;
    border-right-color:#a66cff;

    animation:photoRotate 5s linear infinite;

    box-shadow:
        0 0 20px rgba(255,80,190,.3),
        inset 0 0 20px rgba(160,80,255,.2);
}

@keyframes photoRotate{
    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

.photo-sparkle{
    position:absolute;

    color:#fff;
    font-size:18px;

    text-shadow:
        0 0 8px #fff,
        0 0 18px #ff6bc1;

    z-index:4;

    animation:sparkleFloat 1.5s ease-in-out infinite alternate;
}

.sparkle-1{
    top:3px;
    right:10px;
}

.sparkle-2{
    bottom:18px;
    left:3px;

    animation-delay:.4s;
}

.sparkle-3{
    top:35px;
    left:-3px;

    animation-delay:.8s;
}

@keyframes sparkleFloat{
    from{
        transform:scale(.7) rotate(0deg);
        opacity:.4;
    }

    to{
        transform:scale(1.3) rotate(20deg);
        opacity:1;
    }
}

.photo-hint{
    font-size:9px;
    letter-spacing:2px;
    color:#aaa;
    margin-top:-2px;
}

/* =========================
   CAKE
========================= */

.cake-area{
    height:155px;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    margin:0;
}

.cake{
    position:relative;

    width:180px;
    height:100px;

    margin-top:30px;
}

.layer{
    position:absolute;

    left:0;

    width:180px;
    height:48px;

    border-radius:14px;

    background:
        linear-gradient(
            #ff6eb6,
            #d82b7c
        );

    box-shadow:
        0 10px 20px rgba(0,0,0,.25);
}

.layer.top{
    top:20px;
}

.layer.bottom{
    top:62px;

    background:
        linear-gradient(
            #ff4fa3,
            #b51d65
        );
}

.cream{
    position:absolute;

    width:180px;
    height:25px;

    top:48px;

    background:#fff;

    border-radius:50%;

    box-shadow:
        0 5px 12px rgba(0,0,0,.2);
}

.candle{
    position:absolute;

    width:10px;
    height:48px;

    background:
        linear-gradient(
            90deg,
            #7e5cff,
            #b88aff
        );

    top:-28px;

    border-radius:5px;
}

.candle:nth-child(1){
    left:48px;
}

.candle:nth-child(2){
    left:85px;
}

.candle:nth-child(3){
    left:122px;
}

.flame{
    position:absolute;

    width:14px;
    height:20px;

    background:#ffd43b;

    border-radius:
        50% 50% 50% 0;

    transform:rotate(-45deg);

    top:-22px;
    left:-2px;

    box-shadow:
        0 0 20px #ff9d00;

    animation:
        flame .6s infinite alternate;
}

@keyframes flame{
    from{
        transform:rotate(-45deg) scale(.85);
    }

    to{
        transform:rotate(-45deg) scale(1.15);
    }
}

/* =========================
   NAME + MESSAGE
========================= */

.name{
    font-size:32px;
    font-weight:700;

    margin-top:0;

    color:#fff;

    text-shadow:
        0 0 10px rgba(255,120,210,.7),
        0 0 30px rgba(180,80,255,.4);
}

.message{
    margin:8px auto 0;

    max-width:420px;

    min-height:68px;

    color:#ddd;

    font-size:13px;
    line-height:1.8;
}

/* =========================
   BUTTONS
========================= */

.buttons{
    display:flex;

    justify-content:center;

    gap:12px;

    margin-top:12px;

    flex-wrap:wrap;
}

button{
    border:0;

    padding:12px 20px;

    border-radius:50px;

    color:#fff;

    font-family:inherit;

    font-weight:600;

    cursor:pointer;

    transition:.3s;
}

.wish-btn{
    background:
        linear-gradient(
            135deg,
            #ff3fa4,
            #8b4dff
        );

    box-shadow:
        0 10px 30px rgba(183,52,255,.3);
}

.music-btn{
    background:rgba(255,255,255,.08);

    border:
        1px solid rgba(255,255,255,.15);
}

button:hover{
    transform:
        translateY(-4px)
        scale(1.03);
}

.footer{
    position:absolute;

    bottom:13px;
    left:0;

    width:100%;

    font-size:9px;

    letter-spacing:2px;

    color:#888;
}

/* =========================
   CONFETTI
========================= */

.confetti{
    position:fixed;

    width:8px;
    height:12px;

    top:-20px;

    z-index:50;

    pointer-events:none;

    animation:
        confettiFall
        linear
        forwards;
}

@keyframes confettiFall{
    to{
        transform:
            translateY(110vh)
            rotate(720deg);

        opacity:0;
    }
}

/* =========================
   FIREWORKS
========================= */

.firework{
    position:fixed;

    width:5px;
    height:5px;

    border-radius:50%;

    z-index:40;

    pointer-events:none;
}

.spark{
    position:absolute;

    width:4px;
    height:4px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 8px currentColor;

    animation:
        explode
        1s
        ease-out
        forwards;
}

@keyframes explode{
    to{
        transform:
            translate(
                var(--x),
                var(--y)
            );

        opacity:0;
    }
}

/* =========================
   GIFT MODAL
========================= */

.modal{
    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    align-items:center;
    justify-content:center;

    background:
        rgba(0,0,0,.65);

    backdrop-filter:
        blur(10px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(90%,420px);

    padding:35px 25px;

    text-align:center;

    border-radius:30px;

    background:
        rgba(30,10,45,.95);

    border:
        1px solid rgba(255,255,255,.15);

    box-shadow:
        0 30px 100px rgba(0,0,0,.6);

    animation:
        modalIn
        .5s
        ease;
}

@keyframes modalIn{
    from{
        transform:scale(.6);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }
}

.gift{
    font-size:80px;

    animation:
        giftBounce
        1s
        infinite
        alternate;
}

@keyframes giftBounce{
    from{
        transform:
            translateY(0)
            rotate(-5deg);
    }

    to{
        transform:
            translateY(-12px)
            rotate(5deg);
    }
}

.modal-box h2{
    font-family:'Pacifico',cursive;

    font-size:35px;

    margin:15px 0;

    color:#ff8fd4;
}

.close{
    margin-top:20px;

    background:
        linear-gradient(
            135deg,
            #ff3fa4,
            #8b4dff
        );
}

/* =========================
   FULLSCREEN PHOTO
========================= */

.photo-modal{
    position:fixed;

    inset:0;

    z-index:200;

    display:none;

    align-items:center;
    justify-content:center;

    background:
        rgba(0,0,0,.88);

    backdrop-filter:
        blur(15px);

    padding:20px;
}

.photo-modal.show{
    display:flex;
}

.photo-modal img{
    max-width:92vw;
    max-height:82vh;

    object-fit:contain;

    border-radius:22px;

    border:
        2px solid rgba(255,255,255,.4);

    box-shadow:
        0 0 30px rgba(255,80,190,.5),
        0 0 100px rgba(130,70,255,.35);

    animation:
        photoZoom
        .5s
        ease;
}

@keyframes photoZoom{
    from{
        opacity:0;
        transform:scale(.7);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

.photo-close{
    position:absolute;

    top:20px;
    right:20px;

    width:45px;
    height:45px;

    padding:0;

    border-radius:50%;

    background:
        rgba(255,255,255,.1);

    border:
        1px solid rgba(255,255,255,.25);

    font-size:20px;

    color:#fff;

    cursor:pointer;
}

/* =========================
   MOBILE
========================= */

@media(max-width:480px){

    .card{
        min-height:650px;
        padding-top:25px;
    }

    .profile-photo{
        transform:scale(.9);
        margin-top:4px;
    }

    .cake-area{
        height:140px;
    }

    .cake{
        transform:scale(.78);
    }

    .name{
        font-size:28px;
    }

    .message{
        font-size:12px;
    }

    .balloon{
        transform:scale(.72);
    }

    .footer{
        font-size:8px;
    }
}
</style>
</head>

<body>

<!-- Background -->
<div class="bg-glow"></div>
<div class="stars" id="stars"></div>

<!-- Balloons -->
<div class="balloon b1"></div>
<div class="balloon b2"></div>
<div class="balloon b3"></div>
<div class="balloon b4"></div>


<div class="container">

    <div class="card">

        <!-- Header -->
        <div class="small-title">
            A Special Day For You
        </div>

        <h1>
            Happy Birthday
        </h1>


        <!-- =========================
             BIRTHDAY PERSON PHOTO
        ========================== -->

        <div
            class="profile-photo"
            onclick="openPhoto()"
        >

            <div class="photo-ring"></div>

            <img
                id="birthdayPhoto"
                src="birthday-person.jpg"
                alt="Birthday Person"
            >

            <div class="photo-sparkle sparkle-1">
                
            </div>

            <div class="photo-sparkle sparkle-2">
                
            </div>

            <div class="photo-sparkle sparkle-3">
                
            </div>

        </div>

        <div class="photo-hint">
            TAP PHOTO TO VIEW
        </div>


        <!-- Cake -->
        <div class="cake-area">

            <div class="cake">

                <div class="candle">
                    <div class="flame"></div>
                </div>

                <div class="candle">
                    <div class="flame"></div>
                </div>

                <div class="candle">
                    <div class="flame"></div>
                </div>

                <div class="layer top"></div>

                <div class="cream"></div>

                <div class="layer bottom"></div>

            </div>

        </div>


        <!-- Name -->
        <div
            class="name"
            id="name"
        >
            Alex Hunter
        </div>


        <!-- Typing Message -->
        <div
            class="message"
            id="message"
        ></div>


        <!-- Buttons -->
        <div class="buttons">

            <button
                class="wish-btn"
                onclick="openGift()"
            >
                 Open Gift
            </button>

            <button
                class="music-btn"
                onclick="toggleMusic()"
            >
                 Music
            </button>

        </div>


        <div class="footer">
            MADE WITH  FOR YOUR SPECIAL DAY
        </div>

    </div>

</div>


<!-- =========================
     GIFT MODAL
========================= -->

<div
    class="modal"
    id="modal"
>

    <div class="modal-box">

        <div class="gift">
            
        </div>

        <h2>
            Make A Wish 
        </h2>

        <p id="modalText"></p>

        <button
            class="close"
            onclick="closeGift()"
        >
             Thank You
        </button>

    </div>

</div>


<!-- =========================
     FULLSCREEN PHOTO
========================= -->

<div
    class="photo-modal"
    id="photoModal"
    onclick="closePhotoOutside(event)"
>

    <button
        class="photo-close"
        onclick="closePhoto()"
    >
        
    </button>

    <img
        id="fullPhoto"
        src=""
        alt="Birthday Person"
    >

</div>


<script>

/* ==========================================
   EASY CONFIGURATION
========================================== */

const CONFIG = {

    name: "Tamim X DarkRoot",

    photo: "https://i.top4top.io/p_3930igr5e5.jpg",

    message:
        "Wishing you a beautiful birthday filled with happiness, love, success and countless unforgettable moments. May every dream in your heart come true. ",

    modalMessage:
        "May your birthday be filled with happiness, beautiful memories and endless smiles. May Allah bless your life with peace, success and happiness. "

};


/* ==========================================
   ELEMENTS
========================================== */

const nameElement =
    document.getElementById("name");

const messageElement =
    document.getElementById("message");

const modalText =
    document.getElementById("modalText");

const birthdayPhoto =
    document.getElementById("birthdayPhoto");

const fullPhoto =
    document.getElementById("fullPhoto");

const photoModal =
    document.getElementById("photoModal");


/* ==========================================
   APPLY CONFIG
========================================== */

nameElement.textContent =
    CONFIG.name;

birthdayPhoto.src =
    CONFIG.photo;

modalText.textContent =
    CONFIG.modalMessage;


/* ==========================================
   TYPING EFFECT
========================================== */

let charIndex = 0;

function typeMessage(){

    if(charIndex < CONFIG.message.length){

        messageElement.textContent +=
            CONFIG.message.charAt(charIndex);

        charIndex++;

        setTimeout(
            typeMessage,
            35
        );

    }

}

setTimeout(
    typeMessage,
    900
);


/* ==========================================
   CREATE STARS
========================================== */

const stars =
    document.getElementById("stars");

for(let i=0;i<90;i++){

    const star =
        document.createElement("div");

    star.className =
        "star";

    star.style.left =
        Math.random()*100 + "%";

    star.style.top =
        Math.random()*100 + "%";

    star.style.animationDelay =
        Math.random()*3 + "s";

    star.style.opacity =
        Math.random();

    stars.appendChild(star);

}


/* ==========================================
   CONFETTI
========================================== */

function createConfetti(amount=120){

    const colors = [
        "#ff4fa3",
        "#8d5cff",
        "#00d9ff",
        "#ffd43b",
        "#ffffff"
    ];

    for(let i=0;i<amount;i++){

        const confetti =
            document.createElement("div");

        confetti.className =
            "confetti";

        confetti.style.left =
            Math.random()*100 + "vw";

        confetti.style.background =
            colors[
                Math.floor(
                    Math.random()*colors.length
                )
            ];

        confetti.style.animationDuration =
            (3 + Math.random()*4) + "s";

        confetti.style.animationDelay =
            Math.random()*1.5 + "s";

        confetti.style.transform =
            `rotate(${Math.random()*360}deg)`;

        document.body.appendChild(
            confetti
        );

        setTimeout(()=>{
            confetti.remove();
        },8000);

    }

}


/* ==========================================
   FIREWORKS
========================================== */

function createFirework(){

    const firework =
        document.createElement("div");

    firework.className =
        "firework";

    firework.style.left =
        (15 + Math.random()*70) + "vw";

    firework.style.top =
        (10 + Math.random()*45) + "vh";

    document.body.appendChild(
        firework
    );

    const colors = [
        "#ff4fa3",
        "#8d5cff",
        "#00d9ff",
        "#ffd43b",
        "#ffffff"
    ];

    for(let i=0;i<35;i++){

        const spark =
            document.createElement("div");

        spark.className =
            "spark";

        const angle =
            (Math.PI*2*i)/35;

        const distance =
            40 + Math.random()*100;

        spark.style.setProperty(
            "--x",
            Math.cos(angle)*distance + "px"
        );

        spark.style.setProperty(
            "--y",
            Math.sin(angle)*distance + "px"
        );

        const color =
            colors[
                Math.floor(
                    Math.random()*colors.length
                )
            ];

        spark.style.color =
            color;

        spark.style.background =
            color;

        firework.appendChild(
            spark
        );

    }

    setTimeout(()=>{
        firework.remove();
    },1200);

}


/* ==========================================
   GIFT
========================================== */

function openGift(){

    document
        .getElementById("modal")
        .classList.add("show");

    createConfetti(180);

    for(let i=0;i<5;i++){

        setTimeout(
            createFirework,
            i*400
        );

    }

}

function closeGift(){

    document
        .getElementById("modal")
        .classList.remove("show");

}


/* ==========================================
   PHOTO PREVIEW
========================================== */

function openPhoto(){

    fullPhoto.src =
        birthdayPhoto.src;

    photoModal.classList.add(
        "show"
    );

}

function closePhoto(){

    photoModal.classList.remove(
        "show"
    );

}

function closePhotoOutside(event){

    if(event.target === photoModal){

        closePhoto();

    }

}


/* ==========================================
   MUSIC
========================================== */

/*
   Put your music file in the same folder:

   birthday.mp3
*/

const audio =
    new Audio("birthday.mp3");

audio.loop = true;

let musicPlaying = false;

function toggleMusic(){

    if(!musicPlaying){

        audio.play().then(()=>{

            musicPlaying = true;

        }).catch(()=>{

            alert(
                "Please add birthday.mp3 in the same folder."
            );

        });

    }else{

        audio.pause();

        musicPlaying = false;

    }

}
